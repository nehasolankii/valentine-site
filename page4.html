<!DOCTYPE html>
<html>
<head>
  <title>For You 💘</title>
  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
    }

    .box {
      background: white;
      padding: 40px;
      border-radius: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      width: 320px;
    }

    h1 {
      color: #ff4d6d;
    }

    #finalText {
      display: none;
      color: #555;
      margin-top: 15px;
    }
    .box {
  background: white;
  padding: 40px;
  border-radius: 30px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  width: 320px;
  position: relative;   /* ADD THIS */
}

.next-btn {
  margin-top: 20px;
  padding: 10px 25px;
  border: none;
  border-radius: 20px;
  background: #ff4d6d;
  color: white;
  cursor: pointer;
}

  
  </style>
</head>
<body>

<div class="box">
  <h1 id="count">3 💗</h1>
  <div id="finalText">
    <p>You’re my favorite person in the whole world babu.</p>
    <p>I choose you — always , today, tomorrow and forever.</p>
    <p>Happy Valentine’s Day My Love💕</p>
  </div>
</div>
<a href="page5.html" id="backBtn" style="display:none;">
  <button class="next-btn">Next MY LOVE💌</button>
</a>


<script>
  let count = 3;
  const counter = document.getElementById("count");
  const finalText = document.getElementById("finalText");

  const timer = setInterval(() => {
    count--;
    if (count > 0) {
      counter.innerHTML = count + " 💗";
    } else {
      counter.innerHTML = "Surprise 🥹";
      finalText.style.display = "block";
      clearInterval(timer);
    }
  }, 1000);
  finalText.style.display = "block";
document.getElementById("backBtn").style.display = "inline-block";

</script>

</body>
</html>
