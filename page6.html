
    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spin the Love 💘</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    h1 {
      color: #fff;
      margin-bottom: 20px;
    }

    /* POINTER */
    .pointer {
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 30px solid white;
      margin-bottom: -10px;
      z-index: 10;
    }

    /* WHEEL */
    .wheel {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: conic-gradient(
        #ff4d6d 0deg 60deg,
        #ffb3c6 60deg 120deg,
        #ff758f 120deg 180deg,
        #ffd6e0 180deg 240deg,
        #ff4d6d 240deg 300deg,
        #ffb3c6 300deg 360deg
      );
      border: 10px solid white;
      transition: transform 3s cubic-bezier(0.17, 0.67, 0.14, 0.93);
    }

    /* BUTTON */
    button {
      margin-top: 30px;
      padding: 14px 40px;
      font-size: 20px;
      border: none;
      border-radius: 40px;
      background: #ff4d6d;
      color: white;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    button:hover {
      transform: scale(1.05);
    }

    /* RESULT */
    .result {
      margin-top: 20px;
      font-size: 22px;
      color: white;
      display: none;
    }
  </style>
</head>

<body>

  <h1>Spin the Wheel 💞</h1>

  <div class="pointer"></div>
  <div class="wheel" id="wheel"></div>

  <button onclick="spinWheel()">Spin 😏</button>

  <div class="result" id="result"></div>

  <script>
    let spinning = false;

    function spinWheel() {
      if (spinning) return;
      spinning = true;

      const wheel = document.getElementById("wheel");
      const result = document.getElementById("result");

      const options = [
        "You get a hug 🫂",
        "You owe me a kiss 😘",
        "Movie date 🎬",
        "Late night call 📞",
        "Surprise gift 🎁",
        "Unlimited cuddles 💕"
      ];

      const randomDeg = Math.floor(Math.random() * 3600) + 720;
      const choice = Math.floor(Math.random() * options.length);

      wheel.style.transform = `rotate(${randomDeg}deg)`;

      setTimeout(() => {
        result.innerText = options[choice];
        result.style.display = "block";
        spinning = false;
      }, 3000);
    }
  </script>

</body>
</html>
