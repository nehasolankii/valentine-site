<!DOCTYPE html>
<html>
<head>
  <title>Virtual Hug 🫂</title>

  <style>
    body {
      background: #ffe6f0;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 💞 pink hug overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 182, 193, 0.6);
      opacity: 0;
      transition: 0.6s;
      z-index: 5;
      pointer-events: none;
    }

    .overlay.show {
      opacity: 1;
    }

    .box {
      background: white;
      padding: 35px;
      border-radius: 25px;
      width: 300px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
      z-index: 10;
      position: relative;
    }

    h1 {
      color: #ff4d6d;
    }

    button {
      margin-top: 20px;
      padding: 14px 30px;
      border-radius: 30px;
      border: none;
      background: #ff4d6d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    p {
      color: #555;
      margin-top: 15px;
    }

    /* 🧸 CARTOON CHARACTER */
    .cartoon {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, 150%) scale(0.4);
      transition: 1s ease;
      z-index: 999; /* 🔥 THIS FIXES EVERYTHING */
    }

    .cartoon.show {
      transform: translate(-50%, -50%) scale(2.2);
    }

    .face {
      width: 120px;
      height: 120px;
      background: #ffd6e8;
      border-radius: 50%;
      position: relative;
    }

    .eye {
      width: 12px;
      height: 12px;
      background: #333;
      border-radius: 50%;
      position: absolute;
      top: 40px;
    }

    .eye.left { left: 35px; }
    .eye.right { right: 35px; }

    .smile {
      width: 40px;
      height: 20px;
      border-bottom: 4px solid #ff4d6d;
      border-radius: 0 0 40px 40px;
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
    }

    .arm {
      width: 60px;
      height: 12px;
      background: #ffd6e8;
      position: absolute;
      top: 60px;
    }

    .arm.left {
      left: -50px;
      transform: rotate(25deg);
    }

    .arm.right {
      right: -50px;
      transform: rotate(-25deg);
    }
  </style>
</head>

<body>

  <!-- overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- 🧸 CARTOON -->
  <div class="cartoon" id="cartoon">
    <div class="face">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="smile"></div>
      <div class="arm left"></div>
      <div class="arm right"></div>
    </div>
  </div>

  <!-- content box -->
  <div class="box">
    <h1>Need a hug? 🫶</h1>
    <button onclick="hug()">HUG ME</button>
    <p id="msg">I’m right here.</p>
  </div>

  <script>
    function hug() {
      document.getElementById("cartoon").classList.add("show");
      document.getElementById("overlay").classList.add("show");

      document.getElementById("msg").innerText =
        "Come here 🥹🤍";

      setTimeout(() => {
        document.getElementById("cartoon").classList.remove("show");
        document.getElementById("overlay").classList.remove("show");

        document.getElementById("msg").innerText =
          "Anytime you need one, I got you 🫂";
      }, 2500);
    }
  </script>

</body>
</html>
